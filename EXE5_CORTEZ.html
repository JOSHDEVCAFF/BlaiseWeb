    <center>
        <h1>MY POEM</h1>
        <hr>
    </center>

    <!-- Stanza 1 -->
    <p>
        The sky is blue, the ocean deep,<br>
        A world of dreams before we sleep.<br>
        The stars above shine bright and clear,<br>
        To guide us through another year.
    </p>

    <!-- 3 Pictures in a row after Stanza 1 -->

        <img src="C2.jpeg" width="50px" height="50px" alt="Image 2">
        <img src="C3.jpeg" width="50px" height="50px" alt="Image 3">
    </p>

    <!-- Stanza 2 -->
    <p>
        The gentle breeze begins to blow,<br>
        As rivers smoothly run and flow.<br>
        Nature sings a tranquil song,<br>
        Where all created things belong.
    </p>

    </p>
