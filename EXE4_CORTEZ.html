<!DOCTYPE html>
<html>
<head>
    <title>Font Tag Attributes</title>
</head>

<body bgcolor="lightblue">

    <center>
        <h1>FONT TAG ATTRIBUTES</h1>
        <hr>

        <font face="Arial" size="5" color="red">
            This is Arial font.
        </font>

        <br><br>

        <font face="Times New Roman" size="6" color="blue">
            This is Times New Roman font.
        </font>

        <br><br>

        <font face="Courier New" size="4" color="green">
            This is Courier New font.
        </font>

        <br><br>

        <font face="Georgia" size="7" color="purple">
            This is Georgia font.
        </font>

        <br><br>

        <font face="Verdana" size="3" color="orange">
            This is Verdana font.
        </font>

    </center>

</body>
</html>
